<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiFill: Crossword Skeleton</title>
  <style>
    :root {
      --bg: #0b101e;
      --surface: #131b30;
      --card: #1a2540;
      --elevated: #243356;
      --cyan: #38bdf8;
      --gold: #ffb703;
      --emerald: #10b981;
      --crimson: #ff5a36;
      --cream: #fff8ec;
      --muted: #b4c0d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #172342 0%, var(--bg) 70%);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .app-shell {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud-card {
      background: var(--surface);
      border: 1px solid var(--elevated);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .lvl-badge {
      background: rgba(56, 189, 248, 0.18);
      color: var(--cyan);
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 3px;
    }
    .hud-title { font-size: 16px; font-weight: 800; }
    .hud-sub { font-size: 12px; color: var(--muted); }
    .combo-pill {
      position: relative;
      background: var(--card);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 6px 10px;
      font-weight: 800;
      font-size: 13px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .combo-pill.bounce {
      transform: scale(1.36);
      background: linear-gradient(90deg, var(--crimson), var(--gold));
      color: #0b101e;
    }
    .score-box { text-align: right; }
    .score-val { font-size: 18px; font-weight: 900; color: var(--gold); }
    .clues-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .clue-chip {
      background: var(--card);
      border: 1px solid var(--elevated);
      border-radius: 12px;
      padding: 7px 11px;
      min-width: 175px;
      flex-shrink: 0;
    }
    .clue-chip.done {
      background: #0b3b2d;
      border-color: var(--emerald);
    }
    .clue-head {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .clue-dir { color: var(--cyan); font-size: 10px; }
    .clue-chip.done .clue-dir { color: var(--emerald); }
    .clue-desc { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .board-frame {
      position: relative;
      background: var(--bg);
      border: 2px solid var(--card);
      border-radius: 18px;
      padding: 12px;
      display: grid;
      gap: 5px;
      aspect-ratio: 9 / 8;
    }
    .cell {
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      position: relative;
      transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .cell.void {
      background: transparent;
    }
    .cell.void::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
    }
    .cell.fixed {
      background: #1f2d4d;
      border: 2px solid #3b5180;
      color: var(--cream);
    }
    .cell.blank {
      background: #0e1729;
      border: 2px dashed #4f6da8;
      color: var(--gold);
      cursor: pointer;
    }
    .cell.blank.intersection {
      border-color: var(--gold);
      box-shadow: inset 0 0 10px rgba(255, 183, 3, 0.16);
    }
    .cell.blank:hover, .cell.blank.drag-over {
      border-style: solid;
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.22);
      transform: scale(1.06);
    }
    .cell.placed {
      background: #fff8ec;
      border: 2px solid #d9b382;
      color: #1e293b;
      cursor: pointer;
    }
    .cell.locked {
      background: #0d3b2e;
      border: 2px solid var(--emerald);
      color: var(--cream);
    }
    .cell.flash {
      animation: cellFlash 0.75s ease;
    }
    .cell.snapped {
      animation: tileSnapImpact 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes tileSnapImpact {
      0% { transform: scale(1.38); box-shadow: 0 0 24px var(--cyan); }
      32% { transform: scale(1.16, 0.85); }
      65% { transform: scale(0.93, 1.09); }
      100% { transform: scale(1); }
    }
    @keyframes cellFlash {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,183,3,0); }
      40% { transform: scale(1.14); background: var(--gold); color: #0b101e; box-shadow: 0 0 22px var(--gold); }
      100% { transform: scale(1); }
    }
    .shockwave-ring {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--cyan);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.4);
      animation: shockwaveExpand 0.58s ease-out forwards;
      z-index: 25;
    }
    @keyframes shockwaveExpand {
      0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.3); }
    }
    .drag-spark {
      position: fixed;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99;
      animation: sparkFade 0.45s ease-out forwards;
    }
    @keyframes sparkFade {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
    }
    .mult-tag {
      font-size: 10px;
      font-family: monospace;
      opacity: 0.85;
    }
    .pts-sub {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      opacity: 0.7;
    }
    .status-banner {
      background: var(--surface);
      border: 1px solid var(--elevated);
      border-radius: 13px;
      padding: 9px 12px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-banner.error {
      background: #2d141c;
      border-color: var(--crimson);
      color: #ffb4bc;
    }
    .rack-card {
      background: var(--surface);
      border: 1px solid var(--elevated);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rack-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 54px;
    }
    .tile {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff8ec;
      border: 2px solid #d9b382;
      color: #1e293b;
      font-weight: 900;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tile.selected {
      transform: translateY(-6px) scale(1.1);
      border-color: var(--gold);
      box-shadow: 0 8px 18px rgba(255, 183, 3, 0.35);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--elevated);
      background: var(--card);
      color: var(--cream);
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: var(--cyan);
      color: #0b101e;
      border: none;
    }
    .floating-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 16px;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
      animation: floatUp 1.2s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      30% { transform: translate(-50%, -14px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -44px) scale(1); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="hud-card">
      <div>
        <span class="lvl-badge" id="lvlBadge">LVL 1 · STARTER SKELETON</span>
        <div class="hud-title" id="lvlTitle">Orbital Crossing</div>
        <div class="hud-sub" id="lvlProgress">Words: 0/5 • Blanks: 0/8</div>
      </div>
      <div class="combo-pill" id="comboPill">🔥 <span id="comboText">×1.0</span></div>
      <div class="score-box">
        <div class="score-val" id="scoreVal">0 PTS</div>
        <div class="hud-sub" id="totalScoreVal">Career: 0</div>
      </div>
    </div>

    <div class="clues-strip" id="cluesStrip"></div>

    <div class="board-frame" id="boardGrid"></div>

    <div class="status-banner" id="statusBanner">
      <span id="statusText">Drag a letter tile into an open blank slot (or tap tile → tap blank)!</span>
    </div>

    <div class="rack-card">
      <div class="rack-row" id="rackRow"></div>
      <div class="btn-row">
        <button onclick="shuffleRack()">Shuffle Rack</button>
        <button onclick="triggerSmartHint()">Smart Hint 💡</button>
        <button onclick="resetLevel()">Reset Grid</button>
        <button class="primary" onclick="nextLevel()">Next Puzzle →</button>
      </div>
    </div>
  </div>

  <script>
    const LEVELS = [
      {
        level: 1, title: "Orbital Crossing", tier: "TIER I · STARTER SKELETON", w: 9, h: 8,
        words: [
          { id: "h1", word: "PLANET", clue: "Celestial world in solar orbit", sx: 1, sy: 1, dir: "H", blanks: [1, 4] },
          { id: "v1", word: "SLOPE", clue: "Inclined mountain gradient", sx: 2, sy: 0, dir: "V", blanks: [1, 3] },
          { id: "h2", word: "SPACE", clue: "The cosmic expanse beyond Earth", sx: 1, sy: 3, dir: "H", blanks: [1, 3] },
          { id: "v2", word: "CROSS", clue: "Intersect from side to side", sx: 4, sy: 3, dir: "V", blanks: [0, 1, 2] },
          { id: "h3", word: "ORBIT", clue: "Curved path around a star", sx: 4, sy: 5, dir: "H", blanks: [0, 2] }
        ],
        mults: { "2,1": "2W", "4,3": "3W", "4,5": "2L", "5,1": "3L" }
      },
      {
        level: 2, title: "Prism & Quartz", tier: "TIER I · STARTER SKELETON", w: 8, h: 8,
        words: [
          { id: "h1", word: "PRISM", clue: "Crystal that splits white light", sx: 1, sy: 1, dir: "H", blanks: [1, 3] },
          { id: "v1", word: "CROWN", clue: "Royal golden headpiece", sx: 2, sy: 0, dir: "V", blanks: [1, 2, 4] },
          { id: "v2", word: "SPARK", clue: "Fiery flash of ignition", sx: 4, sy: 1, dir: "V", blanks: [0, 3] },
          { id: "h2", word: "WHALE", clue: "Giant singing ocean mammal", sx: 2, sy: 3, dir: "H", blanks: [1, 2, 4] },
          { id: "v3", word: "EMBER", clue: "Glowing coal in a dying fire", sx: 6, sy: 3, dir: "V", blanks: [0, 2, 4] }
        ],
        mults: { "2,1": "2W", "4,1": "3L", "4,3": "3W", "6,3": "2W" }
      },
      {
        level: 3, title: "Alchemist's Forge", tier: "TIER II · INTERSECTION NEXUS", w: 8, h: 8,
        words: [
          { id: "h1", word: "QUARTZ", clue: "Piezoelectric silica crystal", sx: 1, sy: 1, dir: "H", blanks: [0, 2, 5] },
          { id: "v1", word: "QUEST", clue: "Heroic expedition", sx: 1, sy: 1, dir: "V", blanks: [0, 2, 4] },
          { id: "v2", word: "AMBER", clue: "Fossilized golden tree resin", sx: 3, sy: 1, dir: "V", blanks: [0, 2, 4] },
          { id: "v3", word: "ZENITH", clue: "Highest celestial point", sx: 6, sy: 1, dir: "V", blanks: [0, 2, 5] },
          { id: "h2", word: "TARGET", clue: "Bullseye mark aimed at", sx: 1, sy: 5, dir: "H", blanks: [0, 2, 4, 5] }
        ],
        mults: { "1,1": "3W", "6,1": "3W", "3,1": "2W", "3,5": "3L" }
      }
    ];

    const LETTER_SCORES = { A:1,E:1,I:1,O:1,U:1,L:1,N:1,S:1,T:1,R:1,D:2,G:2,B:3,C:3,M:3,P:3,F:4,H:4,V:4,W:4,Y:4,K:5,J:8,X:8,Q:10,Z:10 };
    let currentLvlIdx = 0;
    let state = null;

    function buildLevel(idx) {
      const tpl = LEVELS[idx % LEVELS.length];
      const cells = Array.from({ length: tpl.h }, (_, y) =>
        Array.from({ length: tpl.w }, (_, x) => ({
          x, y, fixed: null, isBlank: false, placed: null, expected: null, mult: tpl.mults[`${x},${y}`] || "", words: [], locked: false, flash: false
        }))
      );
      const blankSet = new Set();
      tpl.words.forEach(w => {
        for (let i = 0; i < w.word.length; i++) {
          const cx = w.dir === "H" ? w.sx + i : w.sx;
          const cy = w.dir === "H" ? w.sy : w.sy + i;
          cells[cy][cx].expected = w.word[i];
          cells[cy][cx].words.push(w.id);
          if (w.blanks.includes(i)) blankSet.add(`${cx},${cy}`);
        }
      });
      const rack = [];
      let tId = 1;
      for (let y = 0; y < tpl.h; y++) {
        for (let x = 0; x < tpl.w; x++) {
          const c = cells[y][x];
          if (!c.expected) continue;
          if (blankSet.has(`${x},${y}`)) {
            c.isBlank = true;
            rack.push({ id: "t" + (tId++), char: c.expected, pts: LETTER_SCORES[c.expected] || 1 });
          } else {
            c.fixed = c.expected;
          }
        }
      }
      rack.sort(() => Math.random() - 0.5);
      state = {
        tpl, cells, rack, selectedTileId: null, score: 0,
        careerScore: state ? state.careerScore : 0,
        combo: 0, mult: 1.0, completedWords: new Set()
      };
      render();
    }

    function activeChar(x, y) {
      const c = state.cells[y][x];
      return c.fixed || (c.placed ? c.placed.char : null);
    }

    function wordPattern(w) {
      let s = "";
      for (let i = 0; i < w.word.length; i++) {
        const cx = w.dir === "H" ? w.sx + i : w.sx;
        const cy = w.dir === "H" ? w.sy : w.sy + i;
        s += activeChar(cx, cy) || "_";
      }
      return s;
    }

    function tryDropTile(tileId, x, y) {
      const cell = state.cells[y][x];
      if (!cell || !cell.isBlank || cell.locked) return;
      const tileIdx = state.rack.findIndex(t => t.id === tileId);
      if (tileIdx === -1) return;
      const tile = state.rack[tileIdx];

      if (tile.char !== cell.expected) {
        state.combo = 0;
        state.mult = 1.0;
        setStatus(`Invalid intersection! '${tile.char}' conflicts with crossing word at (${x+1}, ${y+1}).`, true);
        render();
        return;
      }

      state.rack.splice(tileIdx, 1);
      if (cell.placed) state.rack.push(cell.placed);
      cell.placed = tile;
      cell.snapped = true;
      state.selectedTileId = null;

      let newlyDone = [];
      state.tpl.words.forEach(w => {
        if (!state.completedWords.has(w.id) && wordPattern(w) === w.word) {
          state.completedWords.add(w.id);
          newlyDone.push(w);
          for (let i = 0; i < w.word.length; i++) {
            const cx = w.dir === "H" ? w.sx + i : w.sx;
            const cy = w.dir === "H" ? w.sy : w.sy + i;
            state.cells[cy][cx].locked = true;
            state.cells[cy][cx].flash = true;
          }
        }
      });

      spawnShockwaveAndSparks(x, y, newlyDone.length > 0 ? "#10b981" : "#38bdf8");

      if (newlyDone.length > 0) {
        state.combo += newlyDone.length;
        state.mult = state.combo >= 4 ? 4.0 : state.combo === 3 ? 3.0 : state.combo === 2 ? 2.0 : 1.5;
        const pts = Math.round((newlyDone.length * 35 + (newlyDone.length >= 2 ? 50 : 0)) * state.mult);
        state.score += pts;
        state.careerScore += pts;
        const pill = document.getElementById("comboPill");
        pill.classList.add("bounce");
        setTimeout(() => pill.classList.remove("bounce"), 600);
        showPopup(x, y, `+${pts} PTS · ${newlyDone.map(w => w.word).join(" × ")}!`);
        setStatus(`Trie Verified ✓ Completed ${newlyDone.map(w => w.word).join(" & ")}! Combo ×${state.mult}`, false);
      } else {
        state.score += tile.pts;
        state.careerScore += tile.pts;
        showPopup(x, y, `+${tile.pts}`);
        setStatus(`Snapped '${tile.char}' into (${x+1}, ${y+1}).`, false);
      }

      render();
      if (newlyDone.length > 0) {
        spawnCenterGridConfettiExplosion(newlyDone.length >= 2 ? 84 : 56);
      }
      if (state.completedWords.size === state.tpl.words.length) {
        setStatus(`LEVEL ${state.tpl.level} SOLVED! Transitioning to next puzzle in 2.5s...`, false);
        setTimeout(() => nextLevel(), 2500);
      }
    }

    function spawnCenterGridConfettiExplosion(fragmentCount) {
      const board = document.getElementById("boardGrid");
      const rect = board.getBoundingClientRect();
      const canvas = document.createElement("canvas");
      canvas.width = rect.width || 420;
      canvas.height = rect.height || 370;
      canvas.style.position = "absolute";
      canvas.style.inset = "0";
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.pointerEvents = "none";
      canvas.style.zIndex = "40";
      board.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const palette = ["#ffb703", "#10b981", "#38bdf8", "#ff5a36", "#ff7597", "#fff8ec"];
      const minDim = Math.min(canvas.width, canvas.height);

      const fragments = Array.from({ length: fragmentCount }, (_, i) => {
        const angle = (2 * Math.PI * i) / fragmentCount + (Math.random() - 0.5) * 0.28;
        const speed = minDim * (0.28 + Math.random() * 0.56);
        return {
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - canvas.height * 0.22,
          color: palette[i % palette.length],
          w: i % 3 === 0 ? 11 : i % 3 === 1 ? 8 : 14,
          h: i % 3 === 0 ? 5.5 : i % 3 === 1 ? 8 : 4,
          spinBase: Math.random() * 360,
          spinSpeed: 340 + (i % 6) * 120,
          flutterPhase: Math.random() * Math.PI * 2,
          flutterFreq: 9 + (i % 5) * 2.5
        };
      });

      const startMs = performance.now();
      const durationMs = 1850;

      function tick(now) {
        const elapsed = now - startMs;
        if (elapsed >= durationMs) {
          canvas.remove();
          return;
        }
        const t = elapsed / durationMs;
        const fade = Math.max(0, Math.min(1, 1 - Math.max(0, t - 0.58) / 0.42));
        const dragT = 1 - Math.pow(1 - t, 3);
        const gravity = canvas.height * 0.82;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (t < 0.32) {
          const rt = t / 0.32;
          ctx.save();
          ctx.strokeStyle = "#ffb703";
          ctx.globalAlpha = (1 - rt) * 0.85;
          ctx.lineWidth = 4 * (1 - rt * 0.5);
          ctx.beginPath();
          ctx.arc(cx, cy, 18 + rt * 110, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        fragments.forEach(f => {
          const flutterX = Math.sin(t * f.flutterFreq + f.flutterPhase) * 7 * t;
          const px = cx + f.vx * dragT + flutterX;
          const py = cy + f.vy * dragT + 0.5 * gravity * t * t;
          const spinRad = ((f.spinBase + t * f.spinSpeed) * Math.PI) / 180;
          const flipX = Math.cos(t * 12 + f.flutterPhase);

          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(px, py);
          ctx.rotate(spinRad);
          ctx.scale(Math.abs(flipX) < 0.18 ? 0.18 : flipX, 1);
          ctx.fillStyle = f.color;
          ctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
          ctx.restore();
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function spawnShockwaveAndSparks(x, y, color) {
      const board = document.getElementById("boardGrid");
      const ring = document.createElement("div");
      ring.className = "shockwave-ring";
      ring.style.borderColor = color;
      ring.style.left = `${((x + 0.5) / state.tpl.w) * 100}%`;
      ring.style.top = `${((y + 0.5) / state.tpl.h) * 100}%`;
      board.appendChild(ring);
      setTimeout(() => ring.remove(), 600);
    }

    function spawnDragTrail(clientX, clientY) {
      if (!clientX && !clientY) return;
      const spark = document.createElement("div");
      spark.className = "drag-spark";
      spark.style.left = `${clientX}px`;
      spark.style.top = `${clientY}px`;
      spark.style.background = Math.random() > 0.5 ? "#38bdf8" : "#ffb703";
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 450);
    }

    function showPopup(x, y, text) {
      const board = document.getElementById("boardGrid");
      const pop = document.createElement("div");
      pop.className = "floating-popup";
      pop.style.left = `${((x + 0.5) / state.tpl.w) * 100}%`;
      pop.style.top = `${((y + 0.5) / state.tpl.h) * 100}%`;
      pop.textContent = text;
      board.appendChild(pop);
      setTimeout(() => pop.remove(), 1200);
    }

    function setStatus(msg, isErr) {
      const banner = document.getElementById("statusBanner");
      banner.className = isErr ? "status-banner error" : "status-banner";
      document.getElementById("statusText").textContent = msg;
    }

    function render() {
      const tpl = state.tpl;
      document.getElementById("lvlBadge").textContent = `LVL ${tpl.level} · ${tpl.tier}`;
      document.getElementById("lvlTitle").textContent = tpl.title;
      const totalBlanks = state.cells.flat().filter(c => c.isBlank).length;
      const filledBlanks = state.cells.flat().filter(c => c.isBlank && c.placed).length;
      document.getElementById("lvlProgress").textContent = `Words: ${state.completedWords.size}/${tpl.words.length} • Blanks: ${filledBlanks}/${totalBlanks}`;
      document.getElementById("comboText").textContent = `×${state.mult.toFixed(1)}`;
      document.getElementById("scoreVal").textContent = `${state.score} PTS`;
      document.getElementById("totalScoreVal").textContent = `Career: ${state.careerScore}`;

      const strip = document.getElementById("cluesStrip");
      strip.innerHTML = "";
      tpl.words.forEach(w => {
        const done = state.completedWords.has(w.id);
        const chip = document.createElement("div");
        chip.className = "clue-chip" + (done ? " done" : "");
        const pat = wordPattern(w).split("").join(" ");
        chip.innerHTML = `<div class="clue-head"><span class="clue-dir">${w.dir === "H" ? "ACROSS" : "DOWN"}</span><span>${pat}</span></div><div class="clue-desc">${w.clue}</div>`;
        strip.appendChild(chip);
      });

      const grid = document.getElementById("boardGrid");
      grid.style.gridTemplateColumns = `repeat(${tpl.w}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${tpl.h}, 1fr)`;
      grid.innerHTML = "";
      for (let y = 0; y < tpl.h; y++) {
        for (let x = 0; x < tpl.w; x++) {
          const c = state.cells[y][x];
          const el = document.createElement("div");
          if (!c.expected) {
            el.className = "cell void";
          } else if (c.fixed) {
            el.className = "cell fixed" + (c.locked ? " locked" : "") + (c.flash ? " flash" : "");
            el.innerHTML = `${c.fixed}<span class="pts-sub">${LETTER_SCORES[c.fixed]||1}</span>`;
          } else if (c.placed) {
            el.className = "cell placed" + (c.locked ? " locked" : "") + (c.flash ? " flash" : "") + (c.snapped ? " snapped" : "");
            el.innerHTML = `${c.placed.char}<span class="pts-sub">${c.placed.pts}</span>`;
          } else {
            el.className = "cell blank" + (c.words.length >= 2 ? " intersection" : "");
            el.innerHTML = `<span class="mult-tag">${c.mult || (c.words.length >= 2 ? "◆" : "•")}</span>`;
            el.onclick = () => {
              const selId = state.selectedTileId || (state.rack[0] && state.rack[0].id);
              if (selId) tryDropTile(selId, x, y);
            };
            el.ondragover = e => {
              e.preventDefault();
              el.classList.add("drag-over");
              spawnDragTrail(e.clientX, e.clientY);
            };
            el.ondragleave = () => el.classList.remove("drag-over");
            el.ondrop = e => {
              e.preventDefault();
              el.classList.remove("drag-over");
              const tid = e.dataTransfer.getData("text/plain");
              if (tid) tryDropTile(tid, x, y);
            };
          }
          c.flash = false;
          c.snapped = false;
          grid.appendChild(el);
        }
      }

      const rackRow = document.getElementById("rackRow");
      rackRow.innerHTML = "";
      state.rack.forEach(t => {
        const tel = document.createElement("div");
        tel.className = "tile" + (state.selectedTileId === t.id ? " selected" : "");
        tel.draggable = true;
        tel.innerHTML = `${t.char}<span class="pts-sub">${t.pts}</span>`;
        tel.onclick = () => {
          state.selectedTileId = state.selectedTileId === t.id ? null : t.id;
          render();
        };
        tel.ondragstart = e => {
          state.selectedTileId = t.id;
          e.dataTransfer.setData("text/plain", t.id);
        };
        tel.ondrag = e => spawnDragTrail(e.clientX, e.clientY);
        rackRow.appendChild(tel);
      });
    }

    function shuffleRack() {
      state.rack.sort(() => Math.random() - 0.5);
      render();
    }
    function triggerSmartHint() {
      const open = state.cells.flat().find(c => c.isBlank && !c.placed);
      if (!open) return;
      const match = state.rack.find(t => t.char === open.expected);
      if (match) tryDropTile(match.id, open.x, open.y);
    }
    function resetLevel() { buildLevel(currentLvlIdx); }
    function nextLevel() { currentLvlIdx++; buildLevel(currentLvlIdx); }

    buildLevel(0);
  </script>
</body>
</html>
